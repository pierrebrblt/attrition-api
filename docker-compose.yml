# Déploiement local : PostgreSQL + API.
#   cp .env.example .env   (puis adapter les secrets)
#   docker compose up -d --build
#   docker compose run --rm api python -m db.create_db
#   docker compose run --rm api python -m db.load_dataset
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-attrition}
    ports:
      - "127.0.0.1:5432:5432"   # exposé uniquement en local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attrition} -d ${POSTGRES_DB:-attrition}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: ${API_IMAGE:-attrition-api:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      API_KEYS: ${API_KEYS:?définir API_KEYS dans .env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-attrition}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-attrition}
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-0.5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
