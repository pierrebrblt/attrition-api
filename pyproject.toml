[project]
name = "attrition-api"
version = "1.0.0"
description = "API FastAPI de prédiction d'attrition des employés (Futurisys / TechNova Partners)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: test nécessitant une vraie base PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app", "db", "scripts"]
branch = true
omit = ["scripts/api_client_example.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends()/Query() dans les signatures FastAPI
