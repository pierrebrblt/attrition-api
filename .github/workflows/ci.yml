name: CI - Tests API Attrition

"on":
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          pip install fastapi uvicorn joblib scikit-learn pandas pydantic pytest httpx2

      - name: Téléchargement du modèle depuis Hugging Face
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id='PierreBrblt/attrition-model',
              filename='attrition_model.pkl',
              local_dir='models'
          )
          "

      - name: Lancement des tests
        run: pytest tests/ -v